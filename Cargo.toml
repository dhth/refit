[package]
name = "refit"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dhth/refit"
description = "replace local paths with contents from remote git repositories"
homepage = "https://github.com/dhth/refit"
keywords = [
    "cli",
]
categories = [
    "command-line-utilities",
]
exclude = [
    ".agents",
    ".github",
    "deny.toml",
    "mise.toml",
    "mise.lock",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
